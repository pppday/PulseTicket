server:
  port: 8202

spring:
  application:
    name: show-service
  config:
    import:
      - optional:nacos:shared-jdbc.yaml
      - optional:nacos:shared-redis.yaml
      - optional:nacos:shared-mq.yaml
      - optional:nacos:shared-oss.yaml
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        file-extension: yaml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/ticket_show?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

seata:
  enabled: true
  application-id: show-service
  tx-service-group: default_tx_group
  enable-auto-data-source-proxy: true
  data-source-proxy-mode: AT
  service:
    vgroup-mapping:
      default_tx_group: default
    grouplist:
      default: ${SEATA_SERVER_ADDR:127.0.0.1:8091}

management:
  endpoints:
    web:
      exposure:
        include: health,info
